<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Wholesale Ally - Live Simulator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">

  <style>
    /* Strictly prevents iOS Safari from auto-zooming on input focus */
    input[type="text"],
    input[type="password"],
    input[type="number"],
    input[type="email"],
    textarea,
    select {
      font-size: 16px !important;
    }

    .iphone-header {
      background-color: transparent;
    }

    /* Narrowed music bar with rounded borders */
    .music-bar {
      border-radius: 12px;
      margin: 0 14px;
      width: auto;
    }

    /* Role Screen Container */
    #role-screen {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      padding: 10px 14px 6px 14px;
      box-sizing: border-box;
    }

    /* 1. Header Title at the Top (Shifted Down Slightly) */
    .screen-header-title {
      text-align: center;
      margin-top: 18px; /* Brought down away from music bar */
      margin-bottom: 2px;
    }

    .title-livemock {
      font-family: 'Montserrat', sans-serif;
      font-size: 23px;
      font-weight: 900;
      color: #FFFFFF;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .title-simulator {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 25px;
      font-weight: 700;
      color: #d4af37;
      margin-left: 4px;
    }

    /* 2. Middle Practice Options Section */
    .middle-role-section {
      width: 100%;
      margin-top: 2px;
      margin-bottom: 2px;
    }

    .section-title {
      font-size: 12.5px;
      margin-bottom: 8px;
      text-align: center;
      opacity: 0.9;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Option Cards */
    .role-btn {
      padding: 13px 16px !important;
      min-height: 62px;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      border-radius: 12px;
      width: 100%;
    }

    .role-btn-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      text-align: left;
    }

    .role-btn-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .role-btn-title {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-btn-subtitle {
      font-size: 11.5px;
      font-weight: 400;
      opacity: 0.85;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .role-btn-emoji {
      font-size: 24px;
      margin-left: 10px;
      flex-shrink: 0;
    }

    /* 3. Mood Selection Section (Shifted Upwards Closer to Options) */
    .mood-section-container {
      width: 100%;
      margin-top: 6px;  /* Reduced to bring section up */
      margin-bottom: 28px;
    }

    /* 4. Bottom Copyright Notice */
    .in-phone-footer {
      text-align: center;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #1e4620;
      padding-bottom: 2px;
    }
  </style>
</head>
<body>

  <div class="iphone-frame">
    <div class="iphone-header">
      <span class="time-display" id="time-display">9:41</span>
      
      <div class="dynamic-island">
        <div class="camera-lens"></div>
      </div>

      <div class="status-icons">
        <svg class="status-icon-svg" viewBox="0 0 18 12">
          <rect x="0" y="9" width="3" height="3" rx="0.5"/>
          <rect x="4" y="6" width="3" height="6" rx="0.5"/>
          <rect x="8" y="3" width="3" height="9" rx="0.5"/>
          <rect x="12" y="0" width="3" height="12" rx="0.5"/>
        </svg>
        <svg class="status-icon-svg" viewBox="0 0 18 12">
          <path d="M9 10.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4zm-4.2-3.2a6 6 0 0 1 8.4 0l-1.4 1.4a4 4 0 0 0-5.6 0L4.8 7.3zm-3.8-3.8a10 10 0 0 1 16 0l-1.4 1.4a8 8 0 0 0-13.2 0L1 3.5z"/>
        </svg>
        <div class="battery-icon">
          <div class="battery-level"></div>
        </div>
      </div>
    </div>

    <div class="music-bar">
      <div class="marquee-container">
        <span class="marquee-text" id="marquee-song-title">🎵 Stopped - Select Play to Start Lofi Beats</span>
      </div>
      <div class="music-controls">
        <button class="music-ctrl-btn" onclick="prevSong()">⏮️</button>
        <button class="music-ctrl-btn" id="play-pause-btn" onclick="toggleMusic()">▶️</button>
        <button class="music-ctrl-btn" onclick="nextSong()">⏭️</button>
      </div>
    </div>

    <div id="contact-bar" class="contact-bar hidden">
      <div class="contact-info">
        <div class="contact-avatar" id="contact-avatar">?</div>
        <div class="contact-details">
          <span class="contact-name" id="contact-name">Listing Agent</span>
          <span class="contact-number" id="contact-number">+1 (555) 000-0000</span>
        </div>
      </div>
      <button class="nav-back-btn" onclick="goToMenu()">Menu</button>
    </div>

    <div id="passcode-screen" class="screen">
      <div class="passcode-title">Enter Passcode</div>
      <div id="passcode-display" class="passcode-dots">••••</div>
      <div class="keypad">
        <div class="key" onclick="pressKey('1')">1</div>
        <div class="key" onclick="pressKey('2')">2</div>
        <div class="key" onclick="pressKey('3')">3</div>
        <div class="key" onclick="pressKey('4')">4</div>
        <div class="key" onclick="pressKey('5')">5</div>
        <div class="key" onclick="pressKey('6')">6</div>
        <div class="key" onclick="pressKey('7')">7</div>
        <div class="key" onclick="pressKey('8')">8</div>
        <div class="key" onclick="pressKey('9')">9</div>
        <div class="key" style="visibility:hidden"></div>
        <div class="key" onclick="pressKey('0')">0</div>
      </div>
    </div>

    <div id="role-screen" class="screen hidden">
      <div class="screen-header-title">
        <span class="title-livemock">LiveMock</span>
        <span class="title-simulator">Simulator</span>
      </div>

      <div class="middle-role-section">
        <div class="section-title">Choose who you want to practice with:</div>
        
        <div class="btn-group">
          <button class="role-btn" onclick="selectRole('Owner')">
            <div class="role-btn-content">
              <div class="role-btn-text">
                <span class="role-btn-title">Direct Property Owner</span>
                <span class="role-btn-subtitle">Practice negotiating directly with sellers</span>
              </div>
              <span class="role-btn-emoji">🏡</span>
            </div>
          </button>

          <button class="role-btn" onclick="selectRole('Agent')">
            <div class="role-btn-content">
              <div class="role-btn-text">
                <span class="role-btn-title">Listing Real Estate Agent</span>
                <span class="role-btn-subtitle">Practice pitching terms through representation</span>
              </div>
              <span class="role-btn-emoji">🏢</span>
            </div>
          </button>
        </div>
      </div>

      <div class="mood-section-container">
        <div class="section-title">Select Mood:</div>
        <div class="btn-group" style="flex-direction: row;">
          <button class="mood-btn selected" id="mood-neutral" onclick="selectMood('Neutral')">Neutral</button>
          <button class="mood-btn" id="mood-skeptical" onclick="selectMood('Skeptical')">Judgy</button>
          <button class="mood-btn" id="mood-happy" onclick="selectMood('Happy')">Happy</button>
        </div>
      </div>

      <div class="in-phone-footer">
        &copy; THEWHOLESALEALLY - ALL RIGHTS RESERVED
      </div>
    </div>

    <div id="chat-screen" class="screen hidden" style="padding: 10px;">
      <div class="chat-container">
        <div class="chat-box" id="chat-box"></div>
        
        <div class="chat-input-area">
          <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
          <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>

        <div id="reset-container" class="reset-bar hidden">
          <button class="reset-btn" onclick="goToMenu()">🔄 Practice Another Call</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="lofi-audio" loop></audio>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
